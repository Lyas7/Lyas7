<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AI & Automation — Interactive Intro</title>
<style>
  :root{
    --bg:#0b1220; --card:#121a2b; --text:#e8eefc; --muted:#9fb0d0;
    --grad1:#b026ff; --grad2:#00d1ff; --border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box} html,body{height:100%} body{
    margin:0; background:radial-gradient(1200px 800px at -10% -10%, rgba(176,38,255,.15), transparent 60%),
              radial-gradient(1200px 800px at 110% 110%, rgba(0,209,255,.12), transparent 60%),
              var(--bg); color:var(--text); font:16px/1.5 system-ui,Segoe UI,Roboto,Ubuntu,Arial;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:32px 20px}
  h1{font-size:22px; font-weight:700; margin:0 0 20px}
  .card{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
        border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.25)}
  label{display:block; font-size:13px; color:var(--muted); margin:0 0 6px}
  input{width:100%; background:#0f1626; border:1px solid var(--border); color:var(--text);
        padding:12px 14px; border-radius:12px; outline:none}
  input:focus{border-color:#3acaff; box-shadow:0 0 0 3px rgba(58,202,255,.15)}
  .row{display:grid; gap:14px; grid-template-columns:1fr}
  .btn{cursor:pointer; border:0; color:white; padding:12px 16px; border-radius:12px;
       background:linear-gradient(90deg,var(--grad1),var(--grad2)); font-weight:700}
  .muted{color:var(--muted); font-size:12px}
  .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .skill{background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
         border:1px solid var(--border); border-radius:16px; padding:16px; opacity:0; transform:translateY(10px);
         animation:pop .5s forwards}
  .skill .top{display:flex; justify-content:space-between; align-items:center}
  .tag{font-size:10px; text-transform:uppercase; color:#cfe3ff; border:1px solid var(--border);
       padding:2px 6px; border-radius:999px}
  .title{font-weight:800; font-size:28px; text-align:center; margin:20px 0 0}
  .title .glow{position:relative; display:inline-block}
  .title .glow::before{content:\"\"; position:absolute; inset:-6px; filter:blur(12px);
       background:linear-gradient(90deg,var(--grad1),var(--grad2)); opacity:.35; border-radius:8px; z-index:-1}
  @keyframes pop{to{opacity:1; transform:translateY(0)}}
  @media(min-width:640px){ .row{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
  <div class="wrap">
    <h1>AI & Automation — Interactive Intro</h1>

    <!-- LOGIN -->
    <div id="login" class="card">
      <form id="form">
        <div class="row">
          <div>
            <label>Username (Name & Surname)</label>
            <input id="fullname" placeholder="e.g. Ilyas Kurt" required />
          </div>
          <div>
            <label>Password</label>
            <input id="password" type="password" placeholder="••••••••" />
            <div class="muted" style="margin-top:6px">(Password is visual only in this demo)</div>
          </div>
        </div>
        <div style="margin-top:14px; display:flex; gap:10px; align-items:center">
          <button class="btn" type="submit">Reveal Skills</button>
          <span class="muted">Press Enter ↵</span>
        </div>
      </form>
    </div>

    <!-- REVEAL -->
    <div id="reveal" style="display:none; margin-top:18px">
      <h2 id="hello" style="margin:0 0 14px; font-size:26px; font-weight:900"></h2>
      <div id="skills" class="grid"></div>

      <div class="title">
        <span class="glow">Your ideas, my AI Force.</span>
      </div>
    </div>
  </div>

<script>
  const skillsData = [
    { emoji:"🐍", label:"Python", tag:"Core" },
    { emoji:"🔗", label:"Automation (n8n)", tag:"Workflows" },
    { emoji:"💬", label:"ChatGPT", tag:"LLM" },
    { emoji:"✨", label:"Google AI / Gemini", tag:"API" },
    { emoji:"🎙️", label:"ElevenLabs", tag:"Voice" },
    { emoji:"🎬", label:"Runway", tag:"Video" },
    { emoji:"🎨", label:"Midjourney", tag:"Art" },
    { emoji:"🔥", label:"Adobe Firefly", tag:"Design" },
    { emoji:"📊", label:"CSV → JSON", tag:"Data" },
    { emoji:"🌦️", label:"Weather API", tag:"Integration" },
    { emoji:"🤖", label:"Chatbots", tag:"Apps" },
  ];

  const form = document.getElementById('form');
  const fullname = document.getElementById('fullname');
  const login = document.getElementById('login');
  const reveal = document.getElementById('reveal');
  const hello = document.getElementById('hello');
  const skills = document.getElementById('skills');

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = (fullname.value || '').trim();
    const first = (name.split(' ')[0] || 'Guest');
    hello.textContent = `Hi, ${first}! Here are your skills:`;
    // paint cards
    skills.innerHTML = '';
    skillsData.forEach((s, i)=>{
      const card = document.createElement('div');
      card.className = 'skill';
      card.style.animationDelay = (i*0.05)+'s';
      card.innerHTML = `
        <div class="top">
          <div style="font-size:22px">${s.emoji}</div>
          <span class="tag">${s.tag}</span>
        </div>
        <div style="margin-top:10px; font-weight:700">${s.label}</div>
        <div style="color:var(--muted); font-size:13px; margin-top:4px">Practical, AI-powered results.</div>
      `;
      skills.appendChild(card);
    });
    // show
    login.style.display = 'none';
    reveal.style.display = 'block';
    // optional: auto-scroll to top of reveal
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
